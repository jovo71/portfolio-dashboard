name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Afhankelijkheden installeren
        working-directory: ./backend
        run: pip install -r requirements.txt
      
      - name: Tests uitvoeren
        working-directory: ./backend
        run: pytest tests/ -v --tb=short
      
      - name: Linting
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 app/ --max-line-length 120 --ignore=E501,W503

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Node.js 20 instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Afhankelijkheden installeren
        working-directory: ./frontend
        run: npm ci
      
      - name: TypeScript controleren
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Docker Buildx instellen
        uses: docker/setup-buildx-action@v3
      
      - name: Backend Docker image bouwen
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: portfolio-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Frontend Docker image bouwen
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: portfolio-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

